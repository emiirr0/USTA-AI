<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>USTA·AI — Operatör Danışmanı</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body { background: #0B0F12; color: #E8EEF2; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
  code { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 0.92em; color: #9DAAB4; }
  button:disabled { cursor: default !important; }
  select { appearance: auto; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #263039; border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .usta-kok { height: 100vh; display: flex; flex-direction: column; background: #0B0F12; }
  .usta-govde { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 290px) 1fr; }
  .usta-sol { padding: 14px; border-right: 1px solid #263039; overflow-y: auto; }
  .usta-sag { display: flex; flex-direction: column; min-height: 0; }
  .usta-icerik { flex: 1; min-height: 0; overflow-y: auto; }
  .usta-kpi { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .usta-ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* tablet dikey / dar ekran: sol sütun üste, kartlar alt alta */
  @media (max-width: 820px) {
    .usta-kok { height: auto; min-height: 100vh; }
    .usta-govde { grid-template-columns: 1fr; }
    .usta-sol { border-right: none; border-bottom: 1px solid #263039; }
    .usta-icerik { overflow: visible; }
    .usta-kpi { grid-template-columns: repeat(3, 1fr); }
    .usta-ikili { grid-template-columns: 1fr; }
  }
  #yedek { display: none; max-width: 640px; margin: 60px auto; padding: 18px; border-radius: 8px; background: #131A20;
           border: 1px solid #263039; font: 500 14px 'Segoe UI', sans-serif; line-height: 1.6; }
</style>
</head>
<body>
<div id="root"></div>
<noscript><div style="padding:24px">USTA·AI paneli için tarayıcıda JavaScript açık olmalı.</div></noscript>
<div id="yedek">Arayüz başlatılamadı. Lütfen USTA penceresini kapatıp yeniden başlat; sorun sürerse
  <code>python -m usta kontrol</code> komutunu çalıştır.</div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script>
  window.addEventListener("error", function () {
    if (!document.getElementById("root").children.length) document.getElementById("yedek").style.display = "block";
  });
</script>
<script src="app.js"></script>
</body>
</html>
